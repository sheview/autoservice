# Local services. On the current Windows dev machine MariaDB runs natively
# from C:\mariadb11 instead (see CLAUDE.md), so this file is for machines with Docker.
services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: autoservice
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mariadbdata:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mariadbdata:
