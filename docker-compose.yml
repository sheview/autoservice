# Local services. On the current Windows dev machine PostgreSQL runs natively
# from C:\pgsql16 instead (see CLAUDE.md), so this file is for machines with Docker.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autoservice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3000:3000"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
